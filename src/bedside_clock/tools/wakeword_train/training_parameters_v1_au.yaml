# v1: "Hi ESP" for an Australian male speaker.
#   features/hi_esp_au_male   Chatterbox clones of the user's references (main set)
#   features/device_positive  real recordings through the device mic (tools/wake_clips.py record)
#   features/hi_esp_piper     Piper US multi-speaker, low weight (robustness only; drop for speaker-only)
#   features/confusables      near-miss phrases in the same cloned voices (hard negatives)
#   features/device_reject    wake clips the whisper verifier rejected (hard negatives)
# Build each with tools/make_features.py into ~/mww/work/hi_esp_v1/features/<name>.
window_step_ms: 10
train_dir: trained_models/hi_esp_v1
clip_duration_ms: 1500
training_steps: [10000, 4000]
positive_class_weight: [1, 1]
negative_class_weight: [20, 30]
learning_rates: [0.001, 0.0003]
batch_size: 128
time_mask_max_size: [5, 5]
time_mask_count: [2, 2]
freq_mask_max_size: [5, 5]
freq_mask_count: [2, 2]
eval_step_interval: 500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall

features:
  - features_dir: features/hi_esp_au_male
    sampling_weight: 3.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: features/device_positive
    sampling_weight: 3.0
    penalty_weight: 1.5
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: features/hi_esp_piper
    sampling_weight: 0.5
    penalty_weight: 0.5
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: features/confusables
    sampling_weight: 2.0
    penalty_weight: 2.0
    truth: false
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: features/device_reject
    sampling_weight: 2.0
    penalty_weight: 2.0
    truth: false
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/speech
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/dinner_party
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/no_speech
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/dinner_party_eval
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: split
    type: mmap
