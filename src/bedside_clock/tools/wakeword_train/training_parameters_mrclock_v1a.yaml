# "Hey Mr Clock" v1a - device recordings + Piper filler, no clones yet (they are
# still generating). Feature dirs shared with v1 (absolute paths).
window_step_ms: 10
train_dir: trained_models/mrclock_v1a
clip_duration_ms: 1500
training_steps: [6000, 2000]
positive_class_weight: [1, 1]
negative_class_weight: [20, 30]
learning_rates: [0.001, 0.0003]
batch_size: 128
time_mask_max_size: [5, 5]
time_mask_count: [2, 2]
freq_mask_max_size: [5, 5]
freq_mask_count: [2, 2]
eval_step_interval: 500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall

features:
  - features_dir: /home/USER/mww/work/mrclock_v1/features/device_positive
    sampling_weight: 3.0
    penalty_weight: 1.5
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: /home/USER/mww/work/mrclock_v1/features/piper_positive
    sampling_weight: 1.5
    penalty_weight: 0.7
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: /home/USER/mww/work/mrclock_v1/features/device_speech_neg
    sampling_weight: 3.0
    penalty_weight: 2.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/speech
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/dinner_party
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/no_speech
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: /home/USER/mww/data/negative_datasets/dinner_party_eval
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: split
    type: mmap
